<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InsightAI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">IA</span><div><b>InsightAI</b><small>Autonomous Data Analyst</small></div></div>
      <button class="btn primary block" id="btn-new">+ New analysis</button>

      <label class="upload" id="dropzone">
        <input type="file" id="file-input" accept=".csv,.xlsx" hidden>
        <b>Upload dataset</b>
        <span>CSV or XLSX. Drop here or click.</span>
      </label>
      <button class="btn block" id="btn-sample">Try the sample dataset</button>

      <div class="dataset-card" id="dataset-card" hidden>
        <small>Dataset</small>
        <b id="ds-name"></b>
        <span id="ds-size"></span>
      </div>

      <nav class="nav" id="nav">
        <button data-page="overview" class="active">Overview</button>
        <button data-page="quality">Data Quality</button>
        <button data-page="analyst">AI Analyst</button>
        <button data-page="visuals">Visualizations</button>
        <button data-page="reports">Reports</button>
        <button data-page="dashboards">Dashboards</button>
        <button data-page="advanced">Advanced</button>
      </nav>

      <div class="sidebar-foot">
        <div class="mode" id="mode-badge"></div>
        <button class="btn block danger" id="btn-clear" hidden>Clear dataset</button>
      </div>
    </aside>

    <main class="main">
      <button class="menu-btn btn" id="menu-btn" aria-label="Toggle menu">Menu</button>
      <div id="banner" class="banner" hidden></div>
      <div id="loading" class="loading" hidden><span class="spinner"></span><span id="loading-text">Working...</span></div>
      <section id="page"></section>
    </main>
  </div>

  <dialog id="sheet-dialog">
    <form method="dialog">
      <h3>Choose a sheet</h3>
      <p class="muted">This workbook has several sheets.</p>
      <select id="sheet-select"></select>
      <div class="row"><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="sheet-ok" value="ok">Load sheet</button></div>
    </form>
  </dialog>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/pages.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/dashboards.js"></script>
  <script src="/static/js/advanced.js"></script>
</body>
</html>
